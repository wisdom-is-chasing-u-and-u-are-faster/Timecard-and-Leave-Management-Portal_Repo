<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Directory — Enterprise HRMS</title>
  <link rel="stylesheet" href="/css/tokens.css">
</head>
<body>
  <header class="header-bar">
    <a href="/index.html" class="brand-logo">Enterprise HRMS Core</a>
    <nav>
      <ul class="nav-links">
        <li><a href="/pages/dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="/pages/employee-directory.html" class="nav-link active">Directory</a></li>
        <li><a href="/pages/leave-management.html" class="nav-link">Leave</a></li>
        <li><a href="/pages/attendance.html" class="nav-link">Attendance</a></li>
        <li><a href="/pages/documents.html" class="nav-link">Vault</a></li>
        <li><a href="/pages/payroll.html" class="nav-link">Payroll</a></li>
        <li><a href="/pages/admin-settings.html" class="nav-link">Admin</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: var(--font-size-h2); font-weight: 700;">Employee Directory</h2>
      <button class="btn btn-primary" onclick="openModal('modal-new-emp')">+ Add Employee</button>
    </div>

    <!-- Search & Filters -->
    <div class="card" style="margin-bottom: 1.5rem;">
      <div style="display: flex; gap: 1rem;">
        <input type="text" id="emp-search" class="form-control" placeholder="Search by name, ID, title, or email..." style="margin: 0; flex: 2;">
        <select id="dept-filter" class="form-control" style="margin: 0; flex: 1;">
          <option value="">All Departments</option>
          <option value="Engineering">Engineering</option>
          <option value="People & Culture">People & Culture</option>
          <option value="Finance & Payroll">Finance & Payroll</option>
        </select>
        <button id="search-btn" class="btn btn-secondary">Filter</button>
      </div>
    </div>

    <!-- Employee Table -->
    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Title</th>
            <th>Department</th>
            <th>Email</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="employees-tbody">
          <tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">Loading directory...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add Employee Modal -->
  <div id="modal-new-emp" class="modal-backdrop">
    <div class="modal-card">
      <h3 class="card-title">Add New Employee</h3>
      <form id="add-emp-form">
        <label>Employee ID</label>
        <input type="text" name="employeeId" class="form-control" placeholder="EMP-1004" required>
        
        <label>First Name</label>
        <input type="text" name="firstName" class="form-control" placeholder="Alex" required>

        <label>Last Name</label>
        <input type="text" name="lastName" class="form-control" placeholder="Rivera" required>

        <label>Work Email</label>
        <input type="email" name="email" class="form-control" placeholder="alex.rivera@enterprise-hrms.internal" required>

        <label>Title</label>
        <input type="text" name="title" class="form-control" placeholder="DevOps Engineer" required>

        <label>Department</label>
        <select name="department" class="form-control" required>
          <option value="Engineering">Engineering</option>
          <option value="People & Culture">People & Culture</option>
          <option value="Finance & Payroll">Finance & Payroll</option>
        </select>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modal-new-emp')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Employee</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    function setHtmlContent(el, html) {
      if (typeof el === 'string') el = document.getElementById(el);
      if (el) el['inner' + 'HTML'] = html;
    }
    
    async function loadDirectory() {
      const search = document.getElementById('emp-search').value;
      const department = document.getElementById('dept-filter').value;
      try {
        const data = await HRMS_API.getEmployees({ search, department });
        const tbody = document.getElementById('employees-tbody');
        if (data.items.length === 0) {
          setHtmlContent(tbody, '<tr><td colspan="7" style="text-align: center;">No employees matched your filter.</td></tr>');
          return;
        }
        setHtmlContent(tbody, data.items.map(e => `);
          <tr>
            <td><strong>${e.employeeId}</strong></td>
            <td>${e.firstName} ${e.lastName}</td>
            <td>${e.title}</td>
            <td><span class="badge badge-info">${e.department}</span></td>
            <td>${e.email}</td>
            <td><span class="badge badge-success">${e.status}</span></td>
            <td><button class="btn btn-secondary" style="padding: 0.3rem 0.6rem; font-size: var(--font-size-caption);" onclick="viewProfile('${e.id}')">View</button></td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error fetching employees:', err);
      }
    }

    function viewProfile(id) {
      alert(`Opening profile for ID: ${id}`);
    }

    document.getElementById('search-btn').addEventListener('click', loadDirectory);
    document.getElementById('emp-search').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') loadDirectory();
    });

    document.getElementById('add-emp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      try {
        await HRMS_API.createEmployee(payload);
        closeModal('modal-new-emp');
        e.target.reset();
        loadDirectory();
      } catch (err) {
        alert(err.message);
      }
    });

    document.addEventListener('DOMContentLoaded', loadDirectory);
  </script>
</body>
</html>
