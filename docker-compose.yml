version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: timecard-postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-timecard_portal}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: timecard-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "6379:6379"

volumes:
  pgdata:
